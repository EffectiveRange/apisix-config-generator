routes:
- id: getCamera
  uri: /cameras/:cameraId
  methods:
  - GET
  upstream:
    type: roundrobin
    scheme: http
    nodes:
      camera-service:8080: 1
    pass_host: pass
  plugins:
    openid-connect:
      client_id: ${{AUTHENTIK_CLIENT_ID}}
      client_secret: ${{AUTHENTIK_CLIENT_SECRET}}
      discovery: https://authentik.example.com/application/o/cameras/.well-known/openid-configuration
      bearer_only: true
      unauth_action: deny
      ssl_verify: true
      required_scopes:
      - cameras:read
      cache_segment: security:authentik
      use_jwks: true
      accept_none_alg: false
      accept_unsupported_alg: false
      claim_validator:
        audience:
          required: true
          match_with_client_id: true
- id: getHealth
  uri: /health
  methods:
  - GET
  upstream:
    type: roundrobin
    scheme: http
    nodes:
      camera-service:8080: 1
    pass_host: pass
#END
